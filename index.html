<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blokları Düşürmece</title>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="./icon-192.png" type="image/png">
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #e94560;
    --text: #f1f1f1;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 10px;
    min-height: 100%;
  }
  h1 { font-size: 1.3rem; margin: 4px 0; letter-spacing: 1px; }
  .game-area {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  canvas {
    background: var(--panel);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: block;
    max-width: 90vw;
    height: auto;
  }
  .side-panel {
    background: var(--panel);
    border-radius: 8px;
    padding: 14px 18px;
    min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .side-panel h2 {
    font-size: 0.85rem;
    margin: 0 0 6px 0;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stat { font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; }
  .progress-bar {
    background: #0d1326;
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    background: var(--accent);
    height: 100%;
    width: 0%;
    transition: width 0.3s;
  }
  #next-canvas { background: var(--bg); border-radius: 6px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 600;
  }
  button:active { transform: scale(0.96); }
  button.secondary { background: #333a56; }
  .touch-controls {
    display: none;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .touch-controls button { width: 56px; height: 56px; font-size: 1.4rem; border-radius: 50%; }
  @media (pointer: coarse) { .touch-controls { display: flex; } }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 18, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay-box { background: var(--panel); padding: 28px 32px; border-radius: 10px; text-align: center; max-width: 90vw; }
  .overlay-box h2 { margin-top: 0; }

  /* Yeni başlangıç sahnesi: kutu yerine oyunun bir parçası gibi tam ekran */
  #start-overlay {
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 28%, rgba(233,69,96,0.10), transparent 30%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      #0b0f1d;
    background-size: auto, 32px 32px, 32px 32px, auto;
  }
  .start-scene {
    width: min(92vw, 430px);
    min-height: min(82vh, 690px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 7vh 18px 5vh;
    position: relative;
    text-align: center;
  }
  .start-logo {
    font-size: clamp(2.3rem, 11vw, 4.5rem);
    line-height: 1;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.45));
    animation: logoFloat 3s ease-in-out infinite;
  }
  .start-title {
    margin: 16px 0 4px;
    font-size: clamp(2rem, 8vw, 3.1rem);
    line-height: 1.05;
    letter-spacing: 1px;
    font-weight: 800;
    text-shadow: 0 5px 20px rgba(0,0,0,.45);
  }
  .start-subtitle {
    margin: 0;
    color: #aeb6ca;
    font-size: .92rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .block-stage {
    width: min(240px, 58vw);
    height: min(245px, 30vh);
    position: relative;
    margin: 10px 0;
  }
  .scene-block {
    --size: clamp(34px, 10vw, 46px);
    width: var(--size);
    height: var(--size);
    position: absolute;
    border-radius: 5px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -4px 0 rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.25);
    animation: blockFloat 3.6s ease-in-out infinite;
  }
  .scene-block::after {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 3px;
  }
  .b1 { left: 50%; top: 8%; background:#39a9db; transform:translateX(-50%); animation-delay:0s; }
  .b2 { left: 32%; top: 26%; background:#e94560; animation-delay:.25s; }
  .b3 { left: 50%; top: 26%; background:#e94560; animation-delay:.35s; }
  .b4 { left: 68%; top: 26%; background:#e94560; animation-delay:.45s; }
  .b5 { left: 41%; top: 44%; background:#f3b61f; animation-delay:.6s; }
  .b6 { left: 59%; top: 44%; background:#f3b61f; animation-delay:.7s; }
  .b7 { left: 50%; top: 62%; background:#52c777; animation-delay:.85s; }
  .b8 { left: 32%; top: 80%; background:#9b6cff; animation-delay:1s; }
  .b9 { left: 50%; top: 80%; background:#9b6cff; animation-delay:1.1s; }
  .b10 { left: 68%; top: 80%; background:#9b6cff; animation-delay:1.2s; }
  .start-actions { display:flex; flex-direction:column; align-items:center; gap:14px; }
  #start-game-btn {
    min-width: 220px;
    min-height: 58px;
    padding: 14px 28px;
    border-radius: 16px;
    font-size: 1.05rem;
    letter-spacing: .4px;
    box-shadow: 0 10px 28px rgba(233,69,96,.28);
  }
  .start-controls {
    color:#8993aa;
    font-size:.82rem;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
  }
  .start-controls b { color:#cbd2e2; font-weight:600; }
  .start-version { color:#515a70; font-size:.68rem; letter-spacing:1px; }
  @keyframes blockFloat {
    0%,100% { margin-top:0; }
    50% { margin-top:8px; }
  }
  @keyframes logoFloat {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-7px); }
  }
  @media (max-height: 650px) {
    .start-scene { padding-top: 4vh; padding-bottom: 3vh; min-height: 90vh; }
    .block-stage { height: 190px; }
    .start-title { margin-top: 8px; }
  }
  .hint { font-size: 0.8rem; color: #888; margin-top: 2px; text-align: center; }

  .keyboard-guide {
    background: var(--panel);
    border-radius: 8px;
    padding: 14px;
    width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    text-align: center;
  }

  .keyboard-guide h2 {
    font-size: 0.85rem;
    margin: 0 0 12px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .key-row {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 5px;
  }

  .key {
    width: 34px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #333a56;
    border: 1px solid #505875;
    border-radius: 5px;
    font-weight: 700;
    font-size: 0.95rem;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }

  .key-wide {
    width: 105px;
    font-size: 0.72rem;
  }

  .key-label {
    font-size: 0.72rem;
    color: #999;
    margin: 4px 0 10px;
  }

  @media (max-width: 700px) {
    .wrap {
      padding: 8px 8px 14px;
      gap: 6px;
    }

    h1 {
      font-size: 1.05rem;
      margin: 2px 0 4px;
    }

    .keyboard-guide { display: none; }

    .game-area {
      width: 100%;
      gap: 7px;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      max-width: 94vw;
      max-height: 64vh;
      width: auto;
      height: auto;
    }

    .side-panel {
      order: -1;
      width: min(94vw, 420px);
      min-width: 0;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: auto auto auto;
      column-gap: 4px;
      row-gap: 0;
      align-items: center;
    }

    .side-panel h2 {
      font-size: 0.62rem;
      margin: 0;
      text-align: center;
    }

    .side-panel .stat {
      font-size: 0.95rem;
      margin: 0;
      text-align: center;
      line-height: 1.15;
    }

    .side-panel h2:nth-of-type(1) { grid-column: 1; grid-row: 1; }
    .side-panel #level { grid-column: 1; grid-row: 2; }
    .side-panel h2:nth-of-type(2) { grid-column: 2; grid-row: 1; }
    .side-panel #target { grid-column: 2; grid-row: 2; }
    .side-panel h2:nth-of-type(3) { grid-column: 3; grid-row: 1; }
    .side-panel #score { grid-column: 3; grid-row: 2; }
    .side-panel h2:nth-of-type(4) { grid-column: 4; grid-row: 1; }

    #next-canvas {
      grid-column: 4;
      grid-row: 2;
      justify-self: center;
      width: 48px;
      height: 48px;
      margin: 0;
    }

    .side-panel .progress-bar {
      grid-column: 1 / -1;
      grid-row: 3;
      height: 6px;
      margin: 5px 4px 0;
    }

    .controls {
      width: min(94vw, 420px);
      gap: 8px;
      margin-top: 1px;
    }

    .controls button {
      flex: 1;
      min-width: 0;
      padding: 9px 8px;
      font-size: 0.85rem;
    }

    .touch-controls {
      width: min(94vw, 420px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 1px;
    }

    .touch-controls button {
      width: 100%;
      height: 52px;
      font-size: 1.25rem;
      padding: 0;
    }
  }
</style>

<style id="responsive-mobile-patch">
/* Tüm telefon genişliklerine uyumlu mobil düzen */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

* {
  box-sizing: border-box;
}

@media (max-width: 700px) {
  body {
    min-width: 0 !important;
    padding: max(6px, env(safe-area-inset-top))
            max(6px, env(safe-area-inset-right))
            max(10px, env(safe-area-inset-bottom))
            max(6px, env(safe-area-inset-left)) !important;
  }

  .game-container,
  .container,
  main {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  /* Tahta 10:20 oranını korur ve ekrana göre küçülür/büyür. */
  #board {
    max-width: 340px !important;
    width: 320px !important;
    height: auto !important;
    aspect-ratio: 1 / 2 !important;
  }

  /* Üst bilgi alanı her ekranda taşmadan sıkışır. */
  .stats,
  .info,
  .top-panel {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }

  /* Mobil kontrol butonları ekran genişliğine göre ayarlanır. */
  .mobile-controls,
  .controls {
    width: 320px !important;
    max-width: 100% !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  .mobile-controls button,
  .controls button,
  button {
    min-height: 48px;
    touch-action: manipulation;
  }

  /* Çok küçük telefonlarda butonların taşmasını önle. */
  @media (max-width: 370px) {
    .mobile-controls button,
    .controls button {
      min-height: 44px;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    #board {
      width: 340px !important;
      max-width: 320px !important;
    }
  }

  /* Büyük telefonlarda oyun gereksiz büyümesin. */
  @media (min-width: 431px) {
    #board,
    .mobile-controls,
    .controls {
      max-width: 320px !important;
    }
  }
}

/* Kısa ekranlı telefonlar: kontrolleri sıkıştır, oyun alanını koru. */
@media (max-width: 700px) and (max-height: 700px) {
  body {
    padding-top: 4px !important;
  }

  .mobile-controls,
  .controls {
    margin-top: 4px !important;
  }

  .mobile-controls button,
  .controls button {
    min-height: 42px;
  }
}
</style>


<style id="mobile-340-680-tuning">
@media (max-width: 600px) {
  #board, .board, #game-board {
    width: 340px !important;
    height: 680px !important;
    max-width: calc(100vw - 24px) !important;
  }
  .controls, .touch-controls, .mobile-controls {
    gap: 8px !important;
  }
  .control-btn, .touch-btn, .mobile-btn {
    width: 52px !important;
    height: 52px !important;
    min-width: 52px !important;
    min-height: 52px !important;
  }
}
</style>

<style id="visual-target-tuning">
/* Referans görseldeki mobil oranlara göre son ölçü ayarları */
@media (max-width: 700px) {
  .wrap {
    padding-left: 8px !important;
    padding-right: 8px !important;

  }

  }

  .touch-controls {
    grid-template-columns: repeat(5, 1fr) !important;

    margin-top: 0 !important;
  }

  .touch-controls button {

    min-height: 48px !important;
    font-size: 1.15rem !important;

  }

  #next-canvas {

  }
}
@media (max-width: 370px) {

    width: 72vw !important;

  }

  }
}
</style>


<style id="start-screen-style">
.start-box {
  padding: 30px 24px !important;
}
.start-icon {
  font-size: 46px;
  line-height: 1;
  margin-bottom: 10px;
}
.start-box h2 {
  font-size: 28px;
  margin-bottom: 10px;
}
.start-box p {
  margin: 8px 0 14px;
}
.start-info {
  font-size: 12px;
  opacity: .8;
  margin-bottom: 18px;
}
#start-game-btn {
  min-width: 180px;
  min-height: 48px;
  font-size: 16px;
  font-weight: 700;
}

  .start-box {
    padding: 24px 18px !important;
  }
  .start-box h2 {
    font-size: 24px;
  }

</head>
<body>
<div class="wrap">
  <h1>🧱 Blokları Düşürmece</h1>
  <div class="game-area">
    <div class="keyboard-guide">
      <h2>Kontroller</h2>

      <div class="key-row">
        <div class="key">↑</div>
      </div>
      <div class="key-label">Döndür</div>

      <div class="key-row">
        <div class="key">←</div>
        <div class="key">↓</div>
        <div class="key">→</div>
      </div>
      <div class="key-label">Hareket / Düşür</div>

      <div class="key-row">
        <div class="key key-wide">SPACE</div>
      </div>
      <div class="key-label">Hızlı düşür</div>

      <div class="key-row">
        <div class="key">P</div>
      </div>
      <div class="key-label">Duraklat</div>
    </div>

    <canvas id="board" width="240" height="480"></canvas>
    <div class="side-panel">
      <h2>Seviye</h2>
      <div class="stat" id="level">1 / 50</div>
      <h2>Hedef Satır</h2>
      <div class="stat" id="target">0 / 3</div>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <h2>Skor</h2>
      <div class="stat" id="score">0</div>
      <h2>Sıradaki</h2>
      <canvas id="next-canvas" width="90" height="90"></canvas>
    </div>
  </div>

  <div class="controls">
    <button id="pause-btn">⏸ Duraklat</button>
    <button class="secondary" id="restart-btn">🔄 Baştan Başla</button>
  </div>

  <div class="touch-controls">
    <button id="left-btn">◀</button>
    <button id="rotate-btn">⟳</button>
    <button id="right-btn">▶</button>
    <button id="down-btn">▼</button>
    <button id="drop-btn">⤓</button>
  </div>

</div>


<div class="overlay show" id="start-overlay">
  <div class="start-scene">
    <div>
      <div class="start-logo">🧱</div>
      <div class="start-title">Blokları<br>Düşürmece</div>
      <div class="start-subtitle">50 seviyelik blok macerası</div>
    </div>

    <div class="block-stage" aria-hidden="true">
      <span class="scene-block b1"></span>
      <span class="scene-block b2"></span>
      <span class="scene-block b3"></span>
      <span class="scene-block b4"></span>
      <span class="scene-block b5"></span>
      <span class="scene-block b6"></span>
      <span class="scene-block b7"></span>
      <span class="scene-block b8"></span>
      <span class="scene-block b9"></span>
      <span class="scene-block b10"></span>
    </div>

    <div class="start-actions">
      <button id="start-game-btn">▶ Oyuna Başla</button>
      <div class="start-controls">
        <span><b>← →</b> Hareket</span><span>•</span>
        <span><b>↻</b> Döndür</span><span>•</span>
        <span><b>↓</b> Hızlı Düşür</span>
      </div>
      <div class="start-version">SEVİYE 1'den BAŞLA</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlay-title">Oyun Bitti</h2>
    <p id="overlay-score"></p>
    <button id="overlay-restart">Tekrar Oyna</button>
  </div>
</div>

<script>
(function() {
  const COLS = 10, ROWS = 20, MAX_LEVEL = 50;
  let CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next-canvas');
  const nextCtx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const targetEl = document.getElementById('target');
  const progressEl = document.getElementById('progress');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayScore = document.getElementById('overlay-score');
  const overlayRestartBtn = document.getElementById('overlay-restart');

  function resizeCanvas() {
    const isMobile = window.matchMedia('(max-width: 700px)').matches;
    // Görseldeki hedefe göre tahta mobil ekranda yaklaşık %70 genişlikte,
    // 10x20 oranı korunacak şekilde ayarlanır.
    const maxW = isMobile
      ? Math.min(window.innerWidth * 0.70, window.innerHeight * 0.40, 340)
      : Math.min(window.innerWidth * 0.85, 300);
    CELL = Math.max(1, Math.floor(maxW / COLS));
    canvas.width = CELL * COLS;
    canvas.height = CELL * ROWS;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const COLORS = {
    I: '#4dd0e1', O: '#ffd54f', T: '#ba68c8',
    S: '#81c784', Z: '#e57373', J: '#64b5f6', L: '#ffb74d'
  };
  const OBSTACLE_SHADES = ['#4a4f66', '#565c78', '#3d425a', '#606a86'];

  const SHAPES = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };

  let board, current, next, score, level, linesInLevel, targetLines, totalLinesCleared;
  let gameOver, paused, levelTransition, dropInterval, lastTime, dropCounter, animId;

  function emptyBoard() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function randomPiece() {
    const keys = Object.keys(SHAPES);
    const key = keys[Math.floor(Math.random() * keys.length)];
    return {
      key,
      shape: SHAPES[key].map(row => row.slice()),
      color: COLORS[key],
      row: 0,
      col: Math.floor((COLS - SHAPES[key][0].length) / 2)
    };
  }

  function dropIntervalForLevel(lvl) {
    return Math.max(80, 500 - (lvl - 1) * 10);
  }

  function targetLinesForLevel(lvl) {
    return 3 + Math.floor(lvl / 4);
  }

  // Build randomized obstacle blocks for the given level, placed at the bottom of an empty board.
  // Gap columns are kept consistent down the whole obstacle stack (a vertical shaft) so every
  // gap is actually reachable by a falling piece — a different, random shaft per level.
  function buildObstacles(lvl) {
    const b = emptyBoard();
    const obstacleRows = Math.min(9, Math.floor((lvl - 1) / 5)); // 0..9 rows across 50 levels
    const startRow = ROWS - obstacleRows;
    if (obstacleRows > 0) {
      const gapCount = lvl > 35 ? 1 : (Math.random() < 0.5 ? 1 : 2);
      const gapCols = new Set();
      while (gapCols.size < gapCount) {
        gapCols.add(Math.floor(Math.random() * COLS));
      }
      for (let r = startRow; r < ROWS; r++) {
        const shade = OBSTACLE_SHADES[Math.floor(Math.random() * OBSTACLE_SHADES.length)];
        for (let c = 0; c < COLS; c++) {
          if (!gapCols.has(c)) {
            b[r][c] = shade;
          }
        }
      }
    }
    // Extra scattered single obstacle cells for higher levels, kept away from the top spawn area.
    if (lvl > 15) {
      const extraCount = Math.min(14, Math.floor((lvl - 15) / 2));
      let placed = 0;
      let guard = 0;
      while (placed < extraCount && guard < 300) {
        guard++;
        const r = 6 + Math.floor(Math.random() * (ROWS - 6 - obstacleRows - 1));
        const c = Math.floor(Math.random() * COLS);
        if (!b[r][c]) {
          b[r][c] = OBSTACLE_SHADES[Math.floor(Math.random() * OBSTACLE_SHADES.length)];
          placed++;
        }
      }
    }
    return b;
  }

  function startLevel(lvl, keepBoard = false) {
    level = lvl;

    // Normal başlangıçta tahta yeni engellerle oluşturulur.
    // Seviye geçişinde keepBoard=true ise mevcut bloklar korunur.
    if (!keepBoard) {
      board = buildObstacles(lvl);
    } else {
      addLevelObstacles(lvl);
    }

    targetLines = targetLinesForLevel(lvl);
    linesInLevel = 0;
    dropInterval = dropIntervalForLevel(lvl);
    dropCounter = 0;
    current = randomPiece();
    next = randomPiece();
    levelTransition = false;
    updateStats();
  }

  function addLevelObstacles(lvl) {
    const newObstacles = buildObstacles(lvl);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        // Sadece yeni engel olan ve mevcut hücrenin boş olduğu yerlere ekle.
        if (newObstacles[r][c] && !board[r][c]) {
          board[r][c] = newObstacles[r][c];
        }
      }
    }
  }

  function init(startImmediately = true) {
    score = 0;
    totalLinesCleared = 0;
    gameOver = false;
    paused = !startImmediately;
    lastTime = 0;
    startLevel(1);
    overlay.classList.remove('show');
    document.getElementById('pause-btn').textContent = '⏸ Duraklat';
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function updateStats() {
    scoreEl.textContent = score;
    levelEl.textContent = level + ' / ' + MAX_LEVEL;
    targetEl.textContent = linesInLevel + ' / ' + targetLines;
    const pct = Math.min(100, Math.round((linesInLevel / targetLines) * 100));
    progressEl.style.width = pct + '%';
  }

  function collide(shape, row, col) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const nr = row + r, nc = col + c;
        if (nc < 0 || nc >= COLS || nr >= ROWS) return true;
        if (nr >= 0 && board[nr][nc]) return true;
      }
    }
    return false;
  }

  function merge() {
    current.shape.forEach((row, r) => {
      row.forEach((val, c) => {
        if (val) {
          const nr = current.row + r, nc = current.col + c;
          if (nr >= 0) board[nr][nc] = current.color;
        }
      });
    });
  }

  function applyGravity() {
    // Satır temizlendikten sonra her sütundaki blokları aşağı doğru sıkıştır.
    // Böylece altında boşluk kalan bloklar boşlukta asılı kalmaz.
    for (let c = 0; c < COLS; c++) {
      let writeRow = ROWS - 1;

      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c]) {
          const cell = board[r][c];
          board[r][c] = null;
          board[writeRow][c] = cell;
          writeRow--;
        }
      }
    }
  }

  function clearLines() {
    let cleared = 0;

    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(cell => cell)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }

    if (cleared > 0) {
      // Satır temizlendikten sonra boşlukta kalan blokları aşağı indir.
      applyGravity();

      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      linesInLevel += cleared;
      totalLinesCleared += cleared;
      updateStats();

      if (linesInLevel >= targetLines) {
        triggerLevelComplete();
      }
    }
  }

  function triggerLevelComplete() {
    levelTransition = true;

    // 50. seviye tamamlandıysa oyun biter.
    if (level >= MAX_LEVEL) {
      gameOver = true;
      overlayTitle.textContent = '🏆 Tebrikler! 50 Seviyeyi Tamamladın!';
      overlayScore.textContent = 'Toplam Skorun: ' + score;
      overlayRestartBtn.textContent = 'Yeniden Oyna';
      overlay.classList.add('show');

      if (animId) cancelAnimationFrame(animId);
      return;
    }

    // 1-49. seviyelerde oyuncu onayı beklenmeden otomatik geçiş yap.
    setTimeout(() => {
      overlay.classList.remove('show');
      startLevel(level + 1, true);
      levelTransition = false;
      paused = false;
      lastTime = performance.now();
    }, 500);
  }

  function spawnNext() {
    current = next;
    next = randomPiece();
    if (collide(current.shape, current.row, current.col)) {
      endGame();
    }
  }

  function endGame() {
    gameOver = true;
    overlayTitle.textContent = 'Oyun Bitti';
    overlayScore.textContent = 'Seviye ' + level + ' — Skorun: ' + score;
    overlayRestartBtn.textContent = 'Tekrar Oyna';
    overlay.classList.add('show');
    if (animId) cancelAnimationFrame(animId);
  }

  function drop() {
    if (gameOver || paused || levelTransition) return;
    if (!collide(current.shape, current.row + 1, current.col)) {
      current.row++;
    } else {
      merge();
      clearLines();
      if (!levelTransition) spawnNext();
    }
    dropCounter = 0;
  }

  function hardDrop() {
    if (gameOver || paused || levelTransition) return;
    while (!collide(current.shape, current.row + 1, current.col)) {
      current.row++;
      score += 1;
    }
    merge();
    clearLines();
    if (!levelTransition) spawnNext();
    updateStats();
    dropCounter = 0;
  }

  function move(dir) {
    if (gameOver || paused || levelTransition) return;
    if (!collide(current.shape, current.row, current.col + dir)) {
      current.col += dir;
    }
  }

  function rotate() {
    if (gameOver || paused || levelTransition) return;
    const shape = current.shape;
    const rotated = shape[0].map((_, i) => shape.map(row => row[i]).reverse());
    let newCol = current.col;
    if (collide(rotated, current.row, newCol)) {
      const kicks = [1, -1, 2, -2];
      let kicked = false;
      for (const k of kicks) {
        if (!collide(rotated, current.row, current.col + k)) {
          newCol = current.col + k;
          kicked = true;
          break;
        }
      }
      if (!kicked) return;
    }
    current.shape = rotated;
    current.col = newCol;
  }

  function drawCell(context, r, c, color, cellSize) {
    const x = c * cellSize, y = r * cellSize;
    context.fillStyle = color;
    context.fillRect(x, y, cellSize, cellSize);
    context.strokeStyle = 'rgba(0,0,0,0.3)';
    context.lineWidth = 2;
    context.strokeRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
  }

  function draw() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(COLS * CELL, r * CELL);
      ctx.stroke();
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) drawCell(ctx, r, c, board[r][c], CELL);
      }
    }

    if (!gameOver && !levelTransition) {
      let ghostRow = current.row;
      while (!collide(current.shape, ghostRow + 1, current.col)) ghostRow++;
      current.shape.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            const x = (current.col + c) * CELL, y = (ghostRow + r) * CELL;
            ctx.strokeStyle = current.color;
            ctx.globalAlpha = 0.4;
            ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
            ctx.globalAlpha = 1;
          }
        });
      });

      current.shape.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            const nr = current.row + r;
            if (nr >= 0) drawCell(ctx, nr, current.col + c, current.color, CELL);
          }
        });
      });
    }

    nextCtx.fillStyle = '#1a1a2e';
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    const nCell = 18;
    const offX = (nextCanvas.width - next.shape[0].length * nCell) / 2;
    const offY = (nextCanvas.height - next.shape.length * nCell) / 2;
    next.shape.forEach((row, r) => {
      row.forEach((val, c) => {
        if (val) {
          nextCtx.fillStyle = next.color;
          nextCtx.fillRect(offX + c * nCell, offY + r * nCell, nCell, nCell);
          nextCtx.strokeStyle = 'rgba(0,0,0,0.3)';
          nextCtx.strokeRect(offX + c * nCell + 1, offY + r * nCell + 1, nCell - 2, nCell - 2);
        }
      });
    });
  }

  function loop(time = 0) {
    if (!gameOver) {
      const delta = time - lastTime;
      lastTime = time;
      if (!paused && !levelTransition) {
        dropCounter += delta;
        if (dropCounter > dropInterval) drop();
      }
      draw();
      animId = requestAnimationFrame(loop);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (gameOver || levelTransition) return;
    switch (e.key) {
      case 'ArrowLeft': move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown': drop(); break;
      case 'ArrowUp': rotate(); break;
      case ' ': e.preventDefault(); hardDrop(); break;
      case 'p': case 'P': togglePause(); break;
    }
  });

  function togglePause() {
    if (gameOver || levelTransition) return;
    paused = !paused;
    document.getElementById('pause-btn').textContent = paused ? '▶ Devam Et' : '⏸ Duraklat';
    if (!paused) {
      lastTime = performance.now();
    }
  }

  document.getElementById('pause-btn').addEventListener('click', togglePause);
  document.getElementById('restart-btn').addEventListener('click', init);

  overlayRestartBtn.addEventListener('click', () => {
    if (gameOver) {
      init();
    } else if (levelTransition) {
      overlay.classList.remove('show');
      startLevel(level + 1);
      paused = false;
      lastTime = performance.now();
      animId = requestAnimationFrame(loop);
    }
  });

  document.getElementById('left-btn').addEventListener('click', () => move(-1));
  document.getElementById('right-btn').addEventListener('click', () => move(1));
  document.getElementById('down-btn').addEventListener('click', () => drop());
  document.getElementById('rotate-btn').addEventListener('click', () => rotate());
  document.getElementById('drop-btn').addEventListener('click', () => hardDrop());

  const startOverlay = document.getElementById('start-overlay');
  const startGameBtn = document.getElementById('start-game-btn');

  startGameBtn.addEventListener('click', () => {
    startOverlay.classList.remove('show');
    paused = false;
    lastTime = performance.now();
    document.getElementById('pause-btn').textContent = '⏸ Duraklat';
  });

  init(false);
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
